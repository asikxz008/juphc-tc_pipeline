# Run in the learner's Skills Network OpenShift namespace, not Code Engine's
# Kubernetes context. Registry credentials stay in a Kubernetes Secret.
apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  generateName: juphc-tc-pipeline-
spec:
  pipelineRef:
    name: juphc-tc-pipeline
  serviceAccountName: pipeline
  timeout: 30m
  params:
    - name: repo-url
      value: https://github.com/asikxz008/juphc-tc_pipeline.git
    - name: revision
      value: a47946e966758e84caeb30d80a28d47fbc23e251
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: skills-network-learner
          resources:
            requests:
              storage: 1Gi
    - name: registry-auth
      secret:
        secretName: docker-reg-creds
